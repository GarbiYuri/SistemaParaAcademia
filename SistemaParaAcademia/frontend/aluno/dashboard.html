<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Aluno - FATEC Fit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --bg-base: #09090a; --bg-surface: #121214; --bg-card: #202024; --border-color: #29292e; --brand-green: #00b37e; }
        body { background-color: var(--bg-base); color: #e1e1e6; font-family: system-ui, sans-serif; min-height: 100vh; }
        .sidebar { background-color: var(--bg-surface); border-right: 1px solid var(--border-color); min-height: 100vh; }
        .card-custom { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; }
        .nav-link-custom { color: #8d8d99; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
        .nav-link-custom:hover, .nav-link-custom.active { color: #fff; background-color: var(--bg-card); border-left: 4px solid var(--brand-green); }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Aluno -->
        <aside class="col-md-3 col-lg-2 sidebar p-3">
            <div class="d-flex align-items-center gap-2 pb-3 mb-3 border-bottom border-secondary">
                <i class="bi bi-person-circle text-success fs-3"></i>
                <span class="fs-5 fw-bold text-light">FATEC FIT</span>
            </div>
            <div class="card-custom p-2 mb-3">
                <small class="text-secondary d-block">Aluno:</small>
                <strong id="user-name">Aluno</strong>
                <span class="badge bg-success d-block mt-1">MATRICULADO</span>
            </div>
            <nav class="nav flex-column mb-auto">
                <a href="#" class="nav-link-custom active" onclick="carregarMeusTreinos()"><i class="bi bi-journal-check"></i> Meus Treinos</a>
                <a href="#" class="nav-link-custom" onclick="carregarStatusCatraca()"><i class="bi bi-qr-code"></i> Status de Acesso</a>
            </nav>
            <hr class="border-secondary my-3">
            <button class="btn btn-outline-danger w-100" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</button>
        </aside>

        <!-- Área Principal Aluno -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <header class="pb-3 mb-4 border-bottom border-secondary">
                <h3 id="aluno-title" class="fw-bold mb-0">Minha Ficha de Treinos</h3>
            </header>

            <section id="aluno-content">
                <!-- Treinos Carregados Dinamicamente via Procedure -->
            </section>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = window.location.origin;

    async function carregarMeusTreinos() {
        document.getElementById('aluno-title').innerText = "Minha Ficha de Treinos";
        const usuarioLogado = JSON.parse(localStorage.getItem('usuario')) || { id_usuario: 1 };
        
        const res = await fetch(`${API}/alunos/${usuarioLogado.id_usuario}/treinos`);
        const treinos = await res.json();
        
        const container = document.getElementById('aluno-content');
        if(!res.ok || treinos.length === 0) {
            container.innerHTML = `<div class="card-custom p-4 text-center text-secondary">Nenhum treino prescrito no momento.</div>`;
            return;
        }

        let html = '<div class="row g-3">';
        treinos.forEach(t => {
            html += `
                <div class="col-md-6">
                    <div class="card-custom p-3 border-start border-4 border-success">
                        <h5 class="fw-bold text-light">${t.nome_treino}</h5>
                        <p class="mb-1"><strong>Exercício:</strong> ${t.nome_exercicio}</p>
                        <span class="badge bg-secondary mb-2">${t.grupo_muscular}</span>
                        <div class="text-secondary small">${t.series} séries x ${t.repeticoes} reps | Carga: ${t.carga} kg</div>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        container.innerHTML = html;
    }

    async function carregarStatusCatraca() {
        document.getElementById('aluno-title').innerText = "Consultar Acesso à Catraca";
        const usuarioLogado = JSON.parse(localStorage.getItem('usuario')) || { id_usuario: 1 };
        
        const res = await fetch(`${API}/alunos/${usuarioLogado.id_usuario}/validar-catraca`);
        const data = await res.json();
        
        const container = document.getElementById('aluno-content');
        if (data.acesso_liberado) {
            container.innerHTML = `<div class="alert alert-success p-4 text-center"><h4>ACESSO PERMITIDO</h4><p>${data.motivo}</p></div>`;
        } else {
            container.innerHTML = `<div class="alert alert-danger p-4 text-center"><h4>ACESSO RECUSADO</h4><p>${data.motivo}</p></div>`;
        }
    }

    function logout() { localStorage.clear(); window.location.href = '/'; }
    window.onload = carregarMeusTreinos;
</script>
</body>
</html>
