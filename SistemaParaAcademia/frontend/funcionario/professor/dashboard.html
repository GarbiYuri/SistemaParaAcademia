<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor - FATEC Fit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --bg-base: #09090a; --bg-surface: #121214; --bg-card: #202024; --border-color: #29292e; --brand-green: #00b37e; }
        body { background-color: var(--bg-base); color: #e1e1e6; font-family: system-ui, sans-serif; min-height: 100vh; }
        .sidebar { background-color: var(--bg-surface); border-right: 1px solid var(--border-color); min-height: 100vh; }
        .card-custom { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; }
        .nav-link-custom { color: #8d8d99; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
        .nav-link-custom:hover, .nav-link-custom.active { color: #fff; background-color: var(--bg-card); border-left: 4px solid var(--brand-green); }
        .table-dark-custom { --bs-table-bg: var(--bg-surface); --bs-table-border-color: var(--border-color); color: #e1e1e6; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Professor -->
        <aside class="col-md-3 col-lg-2 sidebar p-3">
            <div class="d-flex align-items-center gap-2 pb-3 mb-3 border-bottom border-secondary">
                <i class="bi bi-person-workspace text-success fs-3"></i>
                <span class="fs-5 fw-bold text-light">FATEC FIT</span>
            </div>
            <div class="card-custom p-2 mb-3">
                <small class="text-secondary d-block">Instrutor:</small>
                <strong id="user-name">Professor</strong>
                <span class="badge bg-success d-block mt-1">CORPO DOCENTE</span>
            </div>
            <nav class="nav flex-column mb-auto">
                <a href="#" class="nav-link-custom active" onclick="carregarConsultaTreinos()"><i class="bi bi-search"></i> Consultar Treinos</a>
                <a href="#" class="nav-link-custom" onclick="carregarNovoTreino()"><i class="bi bi-plus-square"></i> Criar Ficha de Treino</a>
            </nav>
            <hr class="border-secondary my-3">
            <button class="btn btn-outline-warning w-100 mb-2" onclick="abrirModalPonto()"><i class="bi bi-clock"></i> Registrar Ponto</button>
            <button class="btn btn-outline-danger w-100" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</button>
        </aside>

        <!-- Área Principal Professor -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <header class="pb-3 mb-4 border-bottom border-secondary">
                <h3 id="prof-title" class="fw-bold mb-0">Área Técnica de Prescrição</h3>
            </header>

            <section id="prof-content">
                <!-- Conteúdo Injetado via JS -->
            </section>
        </main>
    </div>
</div>

<!-- Modal Ponto Eletrônico -->
<div class="modal fade" id="modalPonto" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark border-secondary">
            <div class="modal-header"><h5 class="modal-title">Ponto Eletrônico</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <form onsubmit="baterPonto(event)">
                    <div class="mb-3">
                        <label>ID Funcionário</label>
                        <input type="number" id="ponto-func-id" class="form-control bg-secondary text-light border-0" required>
                    </div>
                    <div class="mb-3">
                        <label>Tipo Batida</label>
                        <select id="ponto-tipo" class="form-select bg-secondary text-light border-0">
                            <option value="ENTRADA">Entrada</option>
                            <option value="SAIDA">Saída</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-warning w-100">Registrar Ponto (Procedure)</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = window.location.origin;

    function carregarConsultaTreinos() {
        document.getElementById('prof-title').innerText = "Consultar Treino de Aluno";
        document.getElementById('prof-content').innerHTML = `
            <div class="card-custom p-4 mb-4">
                <div class="row g-2">
                    <div class="col-md-9"><input type="number" id="busca-id-aluno" class="form-control bg-secondary text-light border-0" placeholder="Digite o ID do Aluno..."></div>
                    <div class="col-md-3"><button class="btn btn-success w-100" onclick="buscarTreinoProcedure()">Buscar (sp_listar_treino_aluno)</button></div>
                </div>
            </div>
            <div id="resultado-treinos"></div>
        `;
    }

    async function buscarTreinoProcedure() {
        const id = document.getElementById('busca-id-aluno').value;
        const res = await fetch(`${API}/alunos/${id}/treinos`);
        const data = await res.json();
        
        let html = `<div class="card-custom p-3"><table class="table table-dark-custom align-middle">
            <thead><tr><th>Treino</th><th>Exercício</th><th>Grupo</th><th>Séries</th><th>Reps</th><th>Carga</th></tr></thead><tbody>`;
        data.forEach(t => {
            html += `<tr><td>${t.nome_treino}</td><td>${t.nome_exercicio}</td><td>${t.grupo_muscular}</td><td>${t.series}</td><td>${t.repeticoes}</td><td>${t.carga} kg</td></tr>`;
        });
        html += `</tbody></table></div>`;
        document.getElementById('resultado-treinos').innerHTML = html;
    }

    function carregarNovoTreino() {
        document.getElementById('prof-title').innerText = "Prescrever Novo Treino";
        document.getElementById('prof-content').innerHTML = `
            <div class="card-custom p-4 max-w-600 mx-auto">
                <form onsubmit="salvarTreinoProcedure(event)">
                    <div class="mb-3"><label>ID Aluno</label><input type="number" id="t-id-aluno" class="form-control bg-secondary text-light border-0" required></div>
                    <div class="mb-3"><label>ID Professor (Funcionário)</label><input type="number" id="t-id-prof" class="form-control bg-secondary text-light border-0" required></div>
                    <div class="mb-3"><label>Nome do Treino</label><input type="text" id="t-nome" class="form-control bg-secondary text-light border-0" placeholder="Ex: Treino A - Peito/Tríceps" required></div>
                    <button type="submit" class="btn btn-success w-100">Criar Treino (sp_criar_treino)</button>
                </form>
            </div>
        `;
    }

    async function salvarTreinoProcedure(e) {
        e.preventDefault();
        const payload = {
            id_aluno: parseInt(document.getElementById('t-id-aluno').value),
            id_professor: parseInt(document.getElementById('t-id-prof').value),
            nome_treino: document.getElementById('t-nome').value
        };
        const res = await fetch(`${API}/treinos/`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if(res.ok) alert("Treino criado com validação de cargo!");
    }

    function abrirModalPonto() { new bootstrap.Modal(document.getElementById('modalPonto')).show(); }
    async function baterPonto(e) {
        e.preventDefault();
        const payload = { id_funcionario: parseInt(document.getElementById('ponto-func-id').value), tipo_batida: document.getElementById('ponto-tipo').value };
        await fetch(`${API}/ponto/`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        alert("Ponto registrado!");
        bootstrap.Modal.getInstance(document.getElementById('modalPonto')).hide();
    }

    function logout() { localStorage.clear(); window.location.href = '/'; }
    window.onload = carregarConsultaTreinos;
</script>
</body>
</html>
