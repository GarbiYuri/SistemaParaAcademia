<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Funcionário</title>
</head>
<body>
    <h1>Editar Funcionário</h1>

    <form id="formEditarFuncionario">
        <input type="hidden" id="id_funcionario">
        <input type="hidden" id="id_usuario">
        <input type="hidden" id="id_endereco">

        <fieldset>
            <legend>Endereço</legend>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" required><br><br>

            <label for="logradouro">Logradouro:</label>
            <input type="text" id="logradouro" required><br><br>

            <label for="numero">Número:</label>
            <input type="text" id="numero" required><br><br>

            <label for="complemento">Complemento:</label>
            <input type="text" id="complemento"><br><br>

            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" required><br><br>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" required><br><br>

            <label for="uf">UF:</label>
            <input type="text" id="uf" maxlength="2" required><br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Dados Pessoais (Usuário)</legend>

            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" required><br><br>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" required><br><br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" required><br><br>

            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" required><br><br>

            <label for="data_nascimento">Data de Nascimento:</label>
            <input type="date" id="data_nascimento" required><br><br>

            <label for="genero">Gênero:</label>
            <select id="genero" required>
                <option value="M">Masculino</option>
                <option value="F">Feminino</option>
                <option value="Outro">Outro</option>
            </select><br><br>

            <label for="responsavel_id">Responsável:</label>
            <select id="responsavel_id">
                <option value="">Carregando...</option>
            </select><br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Dados Profissionais</legend>

            <label for="cargo_id">Cargo:</label>
            <select id="cargo_id" required>
                <option value="">Carregando...</option>
            </select><br><br>

            <label for="data_admissao">Data Admissão:</label>
            <input type="date" id="data_admissao" required><br><br>

            <label for="status">Status:</label>
            <select id="status">
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
            </select><br><br>
        </fieldset>

        <br>
        <button type="submit">Atualizar</button>
    </form>

    <div id="mensagem"></div>
    <br>
    <a href="list.html">Voltar para Listagem</a>

    <script src="../../../js/funcionario.js"></script>
</body>
</html>
