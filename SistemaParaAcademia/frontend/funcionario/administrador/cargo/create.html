<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Criar Cargo</title>
</head>
<body>
    <h1>Novo Cargo</h1>

    <form id="formCriarCargo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="ex: Professor" required>

        <label for="salario">Salário Base</label>
        <input type="number" step="0.01" id="salario" placeholder="ex: 1960.50" required>

        <label for="status">Status</label>
        <select id="status">
            <option value="Ativo">Ativo</option>
            <option value="Inativo">Inativo</option>
        </select>

        <button type="submit">Cadastrar</button>
    </form>

    <div id="mensagem"></div>
    <a href="/">Tela Inicial</a>

    <script src="../../../js/cargo.js"></script>
</body>
</html>
