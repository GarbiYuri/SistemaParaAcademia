<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Funcionário</title>
</head>
<body>
    <h1>Cadastrar Novo Funcionário</h1>

    <p>
        <a href="../enderecos/create.html" target="_blank">Ou clique aqui para abrir a Tela Exclusiva de Cadastro de Endereços</a>
    </p>

    <form id="formCriarFuncionario">
        <fieldset>
            <legend>Endereço</legend>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" placeholder="00000-000" maxlength="9" required>
            <small>(Digite o CEP para buscar o endereço automaticamente)</small><br><br>

            <label for="logradouro">Logradouro (Rua/Av):</label>
            <input type="text" id="logradouro" required><br><br>

            <label for="numero">Número:</label>
            <input type="text" id="numero" required><br><br>

            <label for="complemento">Complemento:</label>
            <input type="text" id="complemento"><br><br>

            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" required><br><br>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" required><br><br>

            <label for="uf">UF (Estado):</label>
            <input type="text" id="uf" maxlength="2" placeholder="SP" required><br><br>

            <label for="pais">País:</label>
            <input type="text" id="pais" value="Brasil" required><br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Dados Pessoais (Usuário)</legend>

            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" required><br><br>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" required><br><br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" required><br><br>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required><br><br>

            <label for="dataNascimento">Data de Nascimento:</label>
            <input type="date" id="dataNascimento" required><br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Dados Profissionais (Funcionário)</legend>

            <label for="cargo_id">Cargo:</label>
            <select id="cargo_id" required>
                <option value="">Carregando cargos...</option>
            </select><br><br>

            <label for="data_admissao">Data de Admissão:</label>
            <input type="date" id="data_admissao" required><br><br>

            <label for="status">Status:</label>
            <select id="status">
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
            </select><br><br>
        </fieldset>

        <br>
        <button type="submit">Cadastrar Funcionário</button>
    </form>

    <div id="mensagem" style="font-weight: bold; margin-top: 15px;"></div>
    <br>
    <a href="list.html">Voltar para Listagem</a>

    <script src="../../../js/funcionario.js"></script>
</body>
</html>
