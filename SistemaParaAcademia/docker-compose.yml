services:
  mysql:
    image: mysql:8.4
    container_name: SistemaAcademiaMySQL
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-escola}
      MYSQL_USER: ${MYSQL_USER:-academia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-academia_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - app_net
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: sistema-academia-backend:latest
    container_name: SistemaAcademiaBackend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-escola}
      DB_USER: ${MYSQL_USER:-academia}
      DB_PASSWORD: ${MYSQL_PASSWORD:-academia_dev_password}
      FERNET_KEY: ${FERNET_KEY:-_bXEShCF3XG-P1HemSD8NFwOeecaBzOIfsjCJ_gt6EU=}
      ENABLE_AUTH_API: "true"
      API_PORT: "8000"
      AUTH_PORT: "8001"
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - app_net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3).getcode() == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: sistema-academia-frontend:latest
    container_name: SistemaAcademiaFrontEnd
    restart: unless-stopped
    ports:
      - "8088:80"
    networks:
      - app_net
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:

networks:
  app_net:
    # Nome da rede Docker onde a stack será conectada.
    # - Se ela não existir, o compose cria automaticamente (comportamento padrão).
    # - Para usar uma rede já criada (ex.: cloudflare_net), defina no .env:
    #     NETWORK_NAME=cloudflare_net
    #     NETWORK_EXTERNAL=true
    name: ${NETWORK_NAME:-academia_net}
    external: ${NETWORK_EXTERNAL:-false}
